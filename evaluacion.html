<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evaluación · OVA Física</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>

<body>
  <header class="topbar">
    <a class="brand" href="index.html">⚡ OVA Física</a>
    <nav aria-label="Navegación principal">
      <a href="index.html">Inicio</a>
      <a href="contenidos.html">Aprende</a>
      <a href="actividad.html">Practica</a>
      <a href="evaluacion.html">Evalúate</a>
    </nav>
  </header>
  <main>
    <section class="page-hero compact"><span class="eyebrow">Paso 3 · Evalúate</span>
      <h1>Desafío de conversiones</h1>
      <p>10 situaciones nuevas. Responde una por una y recibe retroalimentación al finalizar.</p>
    </section>
    <section class="section">
      <div class="quiz-shell">
        <div class="quiz-progress"><span id="progreso-texto">Pregunta 1 de 10</span>
          <div><i id="barra-progreso"></i></div>
        </div>
        <div id="contenedor-preguntas"></div>
        <div class="quiz-actions"><button id="anterior" class="btn ghost" type="button">← Anterior</button><button
            id="siguiente" class="btn primary" type="button">Siguiente →</button><button id="boton-calificar"
            class="btn primary hidden" type="button">Finalizar evaluación</button></div>
        <div id="resultado-final" class="result-final hidden"></div>
      </div>
    </section>
  </main>
  <footer>OVA Física · Conversión de magnitudes · SENA ADSO</footer>
  <script src="js/evaluacion.js"></script>
</body>

</html>
